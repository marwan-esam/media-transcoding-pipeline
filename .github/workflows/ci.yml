name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Execute Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Provision Test Environment Variables
        run: |
          cat << EOF > .env.test
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET_NAME=${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PROCESSED_BUCKET_NAME=${{ secrets.MINIO_PROCESSED_BUCKET_NAME }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          EOF

      - name: Build Infrastructure and Run Tests
        run: |
          docker compose --env-file .env.test -f docker-compose.test.yml up --build --exit-code-from test-runner

      - name: Teardown Infrastructure
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.refs == 'res/head/main'

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          useranme: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd media-transcoding-pipeline
            git pull origin main
            docker compose up -d --build